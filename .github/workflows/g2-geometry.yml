name: G2 Geometry Candidate

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # Phase 0-1 claims 3.12.14, which was not available at G2 execution.
          # Keep CI runnable on the latest available 3.12 patch and preserve the
          # mismatch as an explicit approval blocker in environment evidence.
          python-version: '3.12.13'
          cache: pip
      - run: python -m pip install -r reference/requirements-g2.txt
      - run: python reference/tools/build_g2_cases.py --output /tmp/g2-cases.json
      - run: cmp reference/cases/g2_geometry_cases_v0.1.json /tmp/g2-cases.json
      - run: python scripts/verify_g2.py
      - run: python reference/compare/reproduce_geometry.py --report /tmp/reproducibility.json
