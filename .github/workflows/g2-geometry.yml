name: G2 Geometry Candidate

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          # Ordinary PR verification is intentionally separate from the pinned
          # Canonical Reference Runtime R0 image under reference/runtime/r0.
          python-version: '3.12.13'
          cache: pip
      - run: python -m pip install -r reference/requirements-g2.txt
      - run: python -m unittest discover -s scripts/tests -v
      - run: python reference/tools/build_g2_cases.py --output /tmp/g2-cases.json
      - run: cmp reference/cases/g2_geometry_cases_v0.1.json /tmp/g2-cases.json
      - run: python scripts/verify_g2.py
      - run: python reference/compare/reproduce_geometry.py --report /tmp/reproducibility.json
