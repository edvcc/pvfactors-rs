name: Execution Readiness

on:
  pull_request:
    branches: [develop]
  push:
    branches: [research/loop-engineering-readiness]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.25.1
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Harness and existing governance self-tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify real preparation assets (not launch or implementation acceptance)
        run: python scripts/verify_project.py assets --output reference/work/readiness/assets.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readiness-assets-${{ github.sha }}
          path: reference/work/readiness/
          if-no-files-found: error
          retention-days: 14
