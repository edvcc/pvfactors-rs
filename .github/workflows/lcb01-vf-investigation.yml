name: LCB-01 VF Investigation

on:
  push:
    branches: [research/vf-lcb01-compatibility]
    paths:
      - '.github/workflows/lcb01-vf-investigation.yml'
      - 'reference/lcb01/**'
  pull_request:
    branches: [research/full-project-launch-closure]
    paths:
      - '.github/workflows/lcb01-vf-investigation.yml'
      - 'reference/lcb01/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lcb01-vf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  investigate-r0:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Install canonical R0 scientific stack plus research-only mpmath
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==2.3.5 \
            pandas==2.2.3 \
            pvlib==0.14.0 \
            shapely==2.1.2 \
            scipy==1.17.0 \
            jsonschema==4.25.1 \
            mpmath==1.3.0
      - name: Run LCB-01 investigation
        run: |
          mkdir -p reference/work/lcb01
          python reference/lcb01/investigate_vf.py \
            --output reference/work/lcb01/lcb01-results.json \
            | tee reference/work/lcb01/summary.log
      - name: Record environment
        if: always()
        run: |
          python --version > reference/work/lcb01/python.txt
          python -m pip freeze > reference/work/lcb01/python-packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcb01-vf-${{ github.sha }}
          path: reference/work/lcb01/
          if-no-files-found: error
          retention-days: 14
